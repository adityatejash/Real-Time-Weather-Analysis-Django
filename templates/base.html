{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time weather analysis dashboard with current conditions, forecasts, temperature trends, and humidity charts.">

    <title>{% block title %}Weather Analysis{% endblock %}</title>

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="{% url 'home' %}" class="header-brand" aria-label="Weather Analysis home">
                <!-- Weather icon SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                    <path d="M22 10a3 3 0 0 0-3-3h-2.207a5.502 5.502 0 0 0-10.702.5"/>
                </svg>
                WeatherLab
            </a>

            <!-- Mobile menu button -->
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle navigation menu" aria-expanded="false" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="4" x2="20" y1="12" y2="12"/>
                    <line x1="4" x2="20" y1="6" y2="6"/>
                    <line x1="4" x2="20" y1="18" y2="18"/>
                </svg>
            </button>

            <nav class="header-nav" id="headerNav" aria-label="Main navigation">
                <a href="{% url 'home' %}" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9,22 9,12 15,12 15,22"/>
                    </svg>
                    Dashboard
                </a>

                <!-- Theme Toggle -->
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" type="button">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" x2="12" y1="1" y2="3"/>
                        <line x1="12" x2="12" y1="21" y2="23"/>
                        <line x1="4.22" x2="5.64" y1="4.22" y2="5.64"/>
                        <line x1="18.36" x2="19.78" y1="18.36" y2="19.78"/>
                        <line x1="1" x2="3" y1="12" y2="12"/>
                        <line x1="21" x2="23" y1="12" y2="12"/>
                        <line x1="4.22" x2="5.64" y1="19.78" y2="18.36"/>
                        <line x1="18.36" x2="19.78" y1="5.64" y2="4.22"/>
                    </svg>

                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ year|default:"2026" }} WeatherLab &mdash; Real-Time Weather Analysis</p>
    </footer>

    <!-- Theme toggle script -->
    <script>
        (() => {
            const toggle = document.getElementById("themeToggle");
            const html = document.documentElement;
            const sunIcon = toggle ? toggle.querySelector(".icon-sun") : null;
            const moonIcon = toggle ? toggle.querySelector(".icon-moon") : null;
            const mobileToggle = document.getElementById("mobileMenuToggle");
            const nav = document.getElementById("headerNav");

            function applyTheme(theme) {
                html.dataset.theme = theme;

                if (sunIcon && moonIcon) {
                    sunIcon.style.display = theme === "dark" ? "none" : "block";
                    moonIcon.style.display = theme === "dark" ? "block" : "none";
                }
            }

            const saved = localStorage.getItem("theme");
            const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

            applyTheme(saved || preferred);

            if (toggle) {
                toggle.addEventListener("click", () => {
                    const current = html.dataset.theme;
                    const next = current === "dark" ? "light" : "dark";

                    localStorage.setItem("theme", next);
                    applyTheme(next);
                });
            }

            if (mobileToggle && nav) {
                mobileToggle.addEventListener("click", () => {
                    const expanded = nav.classList.toggle("open");
                    mobileToggle.setAttribute("aria-expanded", expanded);
                });
            }
        })();
    </script>

    {% block scripts %}
    {% endblock %}

</body>
</html>
