{% extends "base.html" %}

{% block title %}
Weather Analysis
{% endblock %}

{% block content %}

<section>
    <h1>Real-Time Weather Analysis</h1>
    <p>Check current weather conditions and analyze weather data.</p>

    <div>
        <h2>Search for a City</h2>

        <form>
            <input
                type="text"
                name="city"
                placeholder="Enter city name"
            >

            <button type="submit">
                Search
            </button>
        </form>
    </div>
</section>

{% endblock %}
